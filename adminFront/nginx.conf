server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied on every response
    include /etc/nginx/snippets/security-headers.conf;

    # Container healthcheck for docker compose
    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Proxy API requests to the admin-api service (internal Docker network).
    # Pass Cf-Access-Jwt-Assertion and Authorization headers untouched.
    # Using a variable with Docker's internal DNS resolver defers resolution
    # to request time, allowing the container to boot standalone and returning
    # 502 if upstream is down. Never query public DNS for internal service names.
    location /admin-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $admin_api_upstream http://admin-api:3001;
        proxy_pass         $admin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host                    $host;
        proxy_set_header   X-Real-IP               $remote_addr;
        proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto       $scheme;
        proxy_set_header   Authorization           $http_authorization;
        proxy_set_header   Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    }

    # Service workers and Flutter bootstrap must never be cached so
    # updates are detected immediately.
    location ~* (flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # index.html must not be cached either.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # CanvasKit and asset bundles are versioned by Flutter builds; cache for 1 day.
    location ~* ^/(canvaskit|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback for operator console routes (/families, /plans, etc.)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
