# Security headers applied on every response.
# Note on CSP:
# - worker-src 'self' blob: is included because Flutter web (CanvasKit engine)
#   creates web workers from blob: URLs for rendering threads.
# - frame-src includes https://tfg-carecoins.firebaseapp.com (authDomain from
#   firebase_options.dart) and https://accounts.google.com for Firebase auth popups.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://apis.google.com; worker-src 'self' blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://tfg-carecoins.firebaseapp.com https://accounts.google.com; img-src 'self' data: https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
