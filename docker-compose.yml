services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: carecoins
      POSTGRES_PASSWORD: carecoins
      POSTGRES_DB: carecoins
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed — only accessible to other services on the internal network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carecoins -d carecoins"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: ./backend
    environment:
      DATABASE_URL: postgres://carecoins:carecoins@postgres:5432/carecoins
    env_file:
      - path: ./backend/admin-db.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:init

  admin-api:
    build: ./backend
    command: node src/admin/server.js
    profiles: [admin]
    environment:
      DATABASE_URL: postgres://carecoins_admin@postgres:5432/carecoins
      PORT: 3001
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-credentials.json
    env_file:
      - ./backend/admin.env
      - ./backend/admin-db.env
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./firebase-credentials.json:/run/secrets/firebase-credentials.json:ro
    networks:
      - default
      - admin

  admin-web:
    build: ./adminFront
    profiles: [admin]
    depends_on:
      - admin-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - admin

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    profiles: [admin]
    env_file:
      - ./backend/tunnel.env
    depends_on:
      - admin-web
    networks:
      - admin

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://carecoins:carecoins@postgres:5432/carecoins
      PORT: 3000
      NODE_ENV: production
      # Path to the Firebase service account key mounted below
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-credentials.json
    env_file:
      - ./backend/.env
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      # Download your service account JSON from Firebase Console → Project Settings
      # → Service Accounts → Generate new private key, then place it here:
      - ./firebase-credentials.json:/run/secrets/firebase-credentials.json:ro
    # No ports exposed — nginx in the frontend container proxies /api and /uploads

  # Flutter web build served by nginx, which also proxies /api and /uploads
  # to the backend. Firebase web config is compiled into the app — no build args.
  frontend:
    build:
      context: ./fluterFront
    depends_on:
      - backend
    ports:
      - '80:80'   # Cloudflare → port 80 on the server → this container

volumes:
  pgdata:

networks:
  admin:

